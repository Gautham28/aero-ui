<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aero UI | Documentation</title>
  
  <!-- UI Library Source CSS -->
  <link rel="stylesheet" href="../src/css/base.css">
  <link rel="stylesheet" href="../src/css/badge.css">
  <!-- Docs Specific CSS -->
  <link rel="stylesheet" href="docs.css">
</head>
<body>

  <div class="docs-layout">
    
    <!-- Sidebar -->
    <aside class="docs-sidebar">
      <h2>✈️ aero UI</h2>
      <nav class="docs-nav">
        <a href="#home">Home</a>
        <a href="#demo">Demo</a>
        <a href="#usage">Usage</a>
        
        <div class="docs-nav-group">Components</div>
        <a href="#badge" class="active">Badge</a>
        <a href="#button">Button</a>
        <a href="#card">Card</a>
        <a href="#dialog">Dialog</a>
        <a href="#input">Input</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="docs-main">
      
      <!-- BADGE COMPONENT SECTION -->
      <section id="badge" class="component-section">
        <h3># Badge</h3>
        <p class="component-desc">Use <code>.aero-badge</code> for standard badges. Add <code>.outline</code> for an outlined variant.</p>
        
        <!-- Tab Navigation -->
        <div class="docs-tabs">
          <button class="docs-tab-btn active" data-target="preview-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview
          </button>
          <button class="docs-tab-btn" data-target="code-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            Code
          </button>
        </div>

        <!-- Tab Contents -->
        <div class="docs-tab-contents">
          <!-- Preview Pane (Active by default) -->
          <div id="preview-badge" class="docs-tab-content active">
            <div class="docs-preview-box">
              <span class="aero-badge default">Default</span>
              <span class="aero-badge outline">Outline</span>
            </div>
          </div>

          <!-- Code Pane (Hidden by default) -->
          <div id="code-badge" class="docs-tab-content">
            <div class="docs-code-box">
<pre><code>&lt;span class="aero-badge default"&gt;Default&lt;/span&gt;
&lt;span class="aero-badge outline"&gt;Outline&lt;/span&gt;</code></pre>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Docs Specific JS for Tabs -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabButtons = document.querySelectorAll('.docs-tab-btn');

      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          // Find the specific component section this button belongs to
          const section = btn.closest('.component-section');
          const targetId = btn.getAttribute('data-target');

          // Reset active classes for buttons and content IN THIS SECTION ONLY
          section.querySelectorAll('.docs-tab-btn').forEach(b => b.classList.remove('active'));
          section.querySelectorAll('.docs-tab-content').forEach(c => c.classList.remove('active'));

          // Add active class to clicked button and corresponding content
          btn.classList.add('active');
          section.querySelector(`#${targetId}`).classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
