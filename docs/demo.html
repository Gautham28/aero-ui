<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aero UI | Demo Dashboard</title>
  <link rel="stylesheet" href="../src/aero.css"> <!-- Using your new bundle! -->
  <link rel="stylesheet" href="docs.css">
</head>
<body>
  <div class="docs-layout">
    <aside class="docs-sidebar">
      <h2 class="docs-brand"><a href="index.html"><img src="aerouilogo.png" alt="aero UI" class="docs-logo-img docs-logo-img--sidebar"></a></h2>
      <nav class="docs-nav">
        <a href="index.html">Home</a>
        <a href="demo.html" class="active">Demo Dashboard</a>
        <a href="usage.html">Usage</a>
        <hr class="docs-nav-divider">
        <a href="components.html">Components</a>
        <a href="components.html#badge">Badge</a>
        <a href="components.html#button">Button</a>
        <a href="components.html#input">Input</a>
        <a href="components.html#card">Card</a>
        <a href="components.html#dialog">Dialog</a>
      </nav>
    </aside>

    <main class="docs-main">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 class="docs-title">Dashboard</h1>
        <button class="aero-btn" data-dialog-target="new-post">Create New Post</button>
      </div>

      <!-- Demo Cards Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
        <div class="aero-card">
          <div class="aero-card-header">
            <h3 class="aero-card-title">Analytics</h3>
            <span class="aero-badge outline">Live</span>
          </div>
          <div class="aero-card-content">
            <p style="font-size: 2rem; font-weight: bold;">12,482</p>
            <p class="aero-card-description">+12% from last month</p>
          </div>
        </div>
        
        <div class="aero-card">
          <div class="aero-card-header">
            <h3 class="aero-card-title">System Status</h3>
            <span class="aero-badge default">Healthy</span>
          </div>
          <div class="aero-card-content">
            <p style="font-size: 2rem; font-weight: bold;">99.9%</p>
            <p class="aero-card-description">Uptime over 30 days</p>
          </div>
        </div>
      </div>

      <!-- New Post Dialog -->
      <dialog id="new-post" class="aero-dialog">
        <h3 class="aero-card-title">New Post</h3>
        <div class="aero-input-group" style="margin: 1.5rem 0;">
          <label class="aero-label">Title</label>
          <input class="aero-input" placeholder="Enter post title...">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
          <button class="aero-btn outline" data-dialog-close>Cancel</button>
          <button class="aero-btn" data-dialog-close>Publish</button>
        </div>
      </dialog>
    </main>
  </div>
  <script src="../src/js/dialog.js"></script>
</body>
</html>
